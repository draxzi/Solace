openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Solace mental health companion API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI chat operations
  - name: checkin
    description: Daily check-in operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to Solace AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /checkin/respond:
    post:
      operationId: respondToCheckin
      tags: [checkin]
      summary: Submit a mood check-in and get AI response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinRequest"
      responses:
        "200":
          description: Warm response based on mood
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
      required:
        - role
        - content

    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        userName:
          type: string
          nullable: true
        tone:
          type: string
          enum: [warm, direct, balanced]
          nullable: true
      required:
        - messages

    ChatResponse:
      type: object
      properties:
        message:
          type: string
        crisisLevel:
          type: string
          enum: [none, mild, moderate, high]
      required:
        - message
        - crisisLevel

    CheckinRequest:
      type: object
      properties:
        mood:
          type: string
          enum: [good, meh, notgreat, rough]
        userName:
          type: string
          nullable: true
        recentMoods:
          type: array
          items:
            type: string
          description: Last 7 days of moods for pattern detection
      required:
        - mood

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
